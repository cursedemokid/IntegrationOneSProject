<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сверка остатков 1С</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #1f2937;
        }
        main {
            max-width: 760px;
            margin: 48px auto;
            padding: 32px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 10px 24px rgba(15, 23, 42, 0.08);
        }
        h1 {
            margin-top: 0;
            font-size: 28px;
        }
        form {
            display: grid;
            gap: 16px;
        }
        label {
            display: grid;
            gap: 6px;
            font-weight: 600;
        }
        input, button {
            font: inherit;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
        }
        button {
            border: 0;
            background: #2563eb;
            color: #ffffff;
            cursor: pointer;
            font-weight: 700;
        }
        button.secondary {
            background: #e2e8f0;
            color: #1f2937;
        }
        button:disabled {
            background: #94a3b8;
            cursor: wait;
        }
        fieldset {
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            padding: 14px;
        }
        legend {
            padding: 0 6px;
            font-weight: 700;
        }
        .warehouse-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }
        .warehouse-list {
            display: grid;
            gap: 8px;
            max-height: 220px;
            overflow: auto;
        }
        .warehouse-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 400;
        }
        .warehouse-item input {
            width: auto;
        }
        .muted {
            color: #64748b;
        }
        #status, #warehouse-status {
            min-height: 24px;
            margin-top: 10px;
        }
        .error {
            color: #b91c1c;
        }
        .success {
            color: #047857;
        }
    </style>
</head>
<body>
<main>
    <h1>Сверка остатков 1С</h1>
    <p>Укажите начальную и конечную дату периода включительно. При необходимости выберите один или несколько складов.</p>

    <form id="reconcile-form">
        <label>
            Начальная дата
            <input id="start-date" name="start_date" type="date" required>
        </label>
        <label>
            Конечная дата
            <input id="end-date" name="end_date" type="date" required>
        </label>

        <fieldset>
            <legend>Склады</legend>
            <p class="muted">Если не выбрать склады, сверка будет выполнена по всем складам.</p>
            <div class="warehouse-actions">
                <button id="select-all-warehouses" class="secondary" type="button">Выбрать все</button>
                <button id="clear-warehouses" class="secondary" type="button">Снять выбор</button>
            </div>
            <div id="warehouse-list" class="warehouse-list"></div>
            <div id="warehouse-status" class="muted" role="status"></div>
        </fieldset>

        <button id="submit" type="submit">Выполнить сверку</button>
    </form>

    <div id="status" role="status"></div>
</main>

<script>
    const form = document.getElementById("reconcile-form");
    const statusNode = document.getElementById("status");
    const submitButton = document.getElementById("submit");
    const startDateInput = document.getElementById("start-date");
    const endDateInput = document.getElementById("end-date");
    const warehouseList = document.getElementById("warehouse-list");
    const warehouseStatus = document.getElementById("warehouse-status");
    const selectAllWarehousesButton = document.getElementById("select-all-warehouses");
    const clearWarehousesButton = document.getElementById("clear-warehouses");

    const today = new Date();
    const firstDayOfMonth = new Date(today.getFullYear(), today.getMonth(), 1);
    startDateInput.value = formatDate(firstDayOfMonth);
    endDateInput.value = formatDate(today);

    loadWarehouses();

    selectAllWarehousesButton.addEventListener("click", () => {
        getWarehouseCheckboxes().forEach((checkbox) => checkbox.checked = true);
    });

    clearWarehousesButton.addEventListener("click", () => {
        getWarehouseCheckboxes().forEach((checkbox) => checkbox.checked = false);
    });

    form.addEventListener("submit", async (event) => {
        event.preventDefault();
        statusNode.className = "";
        statusNode.textContent = "Выполняется сверка...";
        submitButton.disabled = true;

        try {
            if (window.location.protocol === "file:") {
                throw new Error("Откройте форму через сервер: http://127.0.0.1:8000/, а не как локальный HTML-файл.");
            }

            if (!startDateInput.value || !endDateInput.value) {
                throw new Error("Укажите начальную и конечную дату.");
            }
            if (endDateInput.value < startDateInput.value) {
                throw new Error("Конечная дата должна быть больше или равна начальной дате.");
            }

            const response = await fetch("/reconcile", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({
                    start_date: startDateInput.value,
                    end_date: endDateInput.value,
                    warehouses: getSelectedWarehouses()
                })
            });

            if (!response.ok) {
                throw new Error(await readErrorMessage(response));
            }

            const blob = await response.blob();
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.href = url;
            link.download = `reconciliation_${startDateInput.value}_${endDateInput.value}.xlsx`;
            document.body.appendChild(link);
            link.click();
            link.remove();
            URL.revokeObjectURL(url);

            statusNode.className = "success";
            statusNode.textContent = "Отчёт сформирован и загружен.";
        } catch (error) {
            statusNode.className = "error";
            statusNode.textContent = error.message;
        } finally {
            submitButton.disabled = false;
        }
    });

    async function loadWarehouses() {
        warehouseStatus.className = "muted";
        warehouseStatus.textContent = "Загрузка списка складов...";
        try {
            const response = await fetch("/warehouses");
            if (!response.ok) {
                throw new Error(await readErrorMessage(response));
            }
            const payload = await response.json();
            const warehouses = Array.isArray(payload.warehouses) ? payload.warehouses : [];
            renderWarehouses(warehouses);
        } catch (error) {
            warehouseList.innerHTML = "";
            warehouseStatus.className = "error";
            warehouseStatus.textContent = `Список складов не загружен: ${error.message}. Можно выполнить сверку без фильтра.`;
        }
    }

    function renderWarehouses(warehouses) {
        warehouseList.innerHTML = "";
        if (!warehouses.length) {
            warehouseStatus.className = "muted";
            warehouseStatus.textContent = "Список складов пуст. Сверка будет выполнена по всем складам.";
            return;
        }

        for (const warehouse of warehouses) {
            const id = `warehouse-${Math.random().toString(36).slice(2)}`;
            const label = document.createElement("label");
            label.className = "warehouse-item";

            const checkbox = document.createElement("input");
            checkbox.type = "checkbox";
            checkbox.value = warehouse;
            checkbox.id = id;

            const text = document.createElement("span");
            text.textContent = warehouse;

            label.appendChild(checkbox);
            label.appendChild(text);
            warehouseList.appendChild(label);
        }

        warehouseStatus.className = "success";
        warehouseStatus.textContent = `Загружено складов: ${warehouses.length}.`;
    }

    function getWarehouseCheckboxes() {
        return Array.from(warehouseList.querySelectorAll("input[type='checkbox']"));
    }

    function getSelectedWarehouses() {
        return getWarehouseCheckboxes()
            .filter((checkbox) => checkbox.checked)
            .map((checkbox) => checkbox.value);
    }

    async function readErrorMessage(response) {
        const contentType = response.headers.get("content-type") || "";

        if (contentType.includes("application/json")) {
            try {
                const error = await response.json();
                return error.detail || error.message || `Ошибка выполнения сверки: HTTP ${response.status}`;
            } catch {
                return `Ошибка выполнения сверки: HTTP ${response.status}. Сервер вернул некорректный JSON.`;
            }
        }

        const text = await response.text();
        const looksLikeHtml = text.trim().toLowerCase().startsWith("<!doctype")
            || text.trim().toLowerCase().startsWith("<html");

        if (looksLikeHtml) {
            return `Сервер вернул HTML вместо JSON/Excel: HTTP ${response.status}. Проверьте, что приложение запущено через uvicorn и форма открыта по адресу http://127.0.0.1:8000/.`;
        }

        return text.trim() || `Ошибка выполнения сверки: HTTP ${response.status}`;
    }

    function formatDate(date) {
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, "0");
        const day = String(date.getDate()).padStart(2, "0");
        return `${year}-${month}-${day}`;
    }
</script>
</body>
</html>
